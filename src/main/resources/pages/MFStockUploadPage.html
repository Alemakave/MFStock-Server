<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>MFStock - Загрузка БД</title>
        <script type="text/javascript" src="/js/GenerateSender.js"></script>
        <script type="text/javascript" src="/js/jquery.js"></script>
        <script type="text/javascript" src="/js/db-functions.js"></script>
        <script>
            $(function(){
                $("#header").load("/html-part/header-part.html", function() {
                    let headerElement = $(".header-element.db-function-upload-db").get(0);
                    headerElement.classList.add("selected");
                    headerElement.attributes.removeNamedItem("href");
                    injectDatabaseFunctions();
                });
            });
            $("#upload-form").submit(function () {
                return false;
            });
        </script>
        <link rel="stylesheet" href="/css/generator.css">
        <link rel="stylesheet" href="/css/table.css">
    </head>
    <body>
        <div id="header">
        </div>
        <div id="content">
            <div id="sticker">
                <div id="upload-block">
                    <form id="upload-form" method="POST" enctype="multipart/form-data" action="/mfstock-upload-db">
                        <input type="file" name="data-file" id="data-file" accept="application/vnd.ms-excel, .xlsx">
                        <input class="submit" type="submit" value="Send" />
                    </form>
                </div>
            </div>
            <div id="upload">
            </div>
        </div>
        <script type="text/javascript">
            const inputs = document.getElementsByClassName("input");
            for (let i = 0; i < inputs.length; i++) {
                inputs[i].onclick = null;
                inputs[i].onfocus = inputs[i].select;
            }
        </script>
    </body>
</html>
